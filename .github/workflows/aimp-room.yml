name: AIMP and room
on:
  push:
    paths:
      - 'src/aimp/**'
      - 'src/room/**'
      - 'tests/aimp-*.test.js'
      - 'tests/room/**'
      - 'tests/http/room-api.test.js'
      - '.github/workflows/aimp-room.yml'
  pull_request:
    paths:
      - 'src/aimp/**'
      - 'src/room/**'
      - 'tests/aimp-*.test.js'
      - 'tests/room/**'
      - 'tests/http/room-api.test.js'
      - '.github/workflows/aimp-room.yml'
permissions:
  contents: read
jobs:
  aimp-room:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: ['22.22.0', '24.16.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --experimental-sqlite --experimental-test-isolation=none --test tests/aimp-service.test.js tests/aimp-effect-http.test.js tests/aimp-json.test.js
